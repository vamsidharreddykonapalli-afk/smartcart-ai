version: '3.8'

services:
  # Backend service
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - smartcart-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartcart-network
    restart: unless-stopped

  # MongoDB service (for local testing)
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - smartcart-network
    restart: unless-stopped

networks:
  smartcart-network:
    driver: bridge

volumes:
  mongodb_data:
